name: Build and Push Docker Images

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_TAIKOSCOPE: us-central1-docker.pkg.dev/taikoscope/taikoscope/taikoscope
  REGISTRY_API: us-central1-docker.pkg.dev/taikoscope/taikoscope/api
  PLATFORM: linux/arm64
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_PROJECT_ID: ${{ vars.GAR_PROJECT_ID }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  GAR_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GAR_WORKLOAD_IDENTITY_PROVIDER }}
  GAR_SERVICE_ACCOUNT: ${{ vars.GAR_SERVICE_ACCOUNT }}

jobs:
  build-and-push:
    name: Build and push ${{ matrix.name }} image
    runs-on: [arc-runner-set]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: taikoscope
            registry_env: REGISTRY_TAIKOSCOPE
            dockerfile: Dockerfile.taikoscope
          - name: api
            registry_env: REGISTRY_API
            dockerfile: Dockerfile.api

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate GAR configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for name in GAR_LOCATION GAR_PROJECT_ID GAR_REPOSITORY GAR_WORKLOAD_IDENTITY_PROVIDER GAR_SERVICE_ACCOUNT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository variable $name is required."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GAR_PROJECT_ID }}
          workload_identity_provider: ${{ env.GAR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GAR_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env[matrix.registry_env] }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0
        with:
          version: v0.29.1
          cache-binary: false

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
