name: Build and Push Docker Images

permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_TAIKOSCOPE: us-central1-docker.pkg.dev/taikoscope/taikoscope/taikoscope
  REGISTRY_API: us-central1-docker.pkg.dev/taikoscope/taikoscope/api
  PLATFORM: linux/arm64

jobs:
  build-and-push:
    name: Build and push ${{ matrix.name }} image
    runs-on: [arc-runner-set]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: taikoscope
            registry_env: REGISTRY_TAIKOSCOPE
            dockerfile: Dockerfile.taikoscope
          - name: api
            registry_env: REGISTRY_API
            dockerfile: Dockerfile.api

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GAR
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GAR_JSON_KEY }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env[matrix.registry_env] }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0
        with:
          version: v0.29.1
          cache-binary: false

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
