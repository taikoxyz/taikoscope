name: Publish Docker images to GAR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker tag to publish. Defaults to the git tag or commit SHA.
        required: false
        type: string
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: publish ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: taikoscope
            dockerfile: Dockerfile.taikoscope
          - name: taikoscope-api
            dockerfile: Dockerfile.api
    env:
      GAR_LOCATION: ${{ vars.GAR_LOCATION }}
      GAR_PROJECT_ID: ${{ vars.GAR_PROJECT_ID }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      GAR_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GAR_WORKLOAD_IDENTITY_PROVIDER }}
      GAR_SERVICE_ACCOUNT: ${{ vars.GAR_SERVICE_ACCOUNT }}
      GAR_HOST: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
      GAR_PATH: ${{ vars.GAR_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve publish tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${GITHUB_SHA::7}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Validate GAR configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0

          for name in GAR_LOCATION GAR_PROJECT_ID GAR_REPOSITORY GAR_WORKLOAD_IDENTITY_PROVIDER GAR_SERVICE_ACCOUNT; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository variable $name is required."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GAR_PROJECT_ID }}
          workload_identity_provider: ${{ env.GAR_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GAR_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.GAR_HOST }}/${{ env.GAR_PATH }}/${{ matrix.image.name }}:${{ steps.vars.outputs.tag }}
            ${{ env.GAR_HOST }}/${{ env.GAR_PATH }}/${{ matrix.image.name }}:${{ steps.vars.outputs.sha_tag }}
